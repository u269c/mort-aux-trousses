function sfx(f1, f2, dur, type = 'square', vol = 0.05, delay = 0) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}

const circleAt = lx => clamp(Math.floor(lx / L.len * 9), 0, 8);
const ups = () => bits.reduce((a, b) => a + b, 0);
const endIndex = () => bits.reduce((a, b) => a * 2 + b, 0);
function curPal() { return L.circles ? CIRCLES[circ] : PAL[L.bg]; }
function speedAt(lx) {
  if (L.endless) return Math.min(640, 330 + lx / 60);
  return lerp(L.speed[0], L.speed[1], clamp(lx / L.len, 0, 1));
}

function makeLayer(Lw, minW, maxW, minH, maxH) {
  const items = []; let x = 0;
  while (x < Lw) {
    const w = rand(minW, maxW);
    items.push({ x, w, h: rand(minH, maxH), seed: (Math.random() * 1e9) | 0, spire: Math.random() < 0.3 });
    x += w + rand(0, 24);
  }
  return { L: Lw, items };
}

// ================= level construction =================
function addP(o) {
  const p = Object.assign({ amp: 0, ph: rand(0, TAU), fr: rand(1.2, 2), sinkOff: 0, sinks: false, seed: (Math.random() * 1e9) | 0 }, o);
  p.by = p.y; p.py = p.y;
  plats.push(p);
  const tl = soulTargets[p.tier];
  if (tl && !p.step && !p.goal && !p.arena) {
    while (tl.length && tl[0] < p.lx + p.w) {
      const tx = tl.shift();
      souls.push({ lx: clamp(tx, p.lx + 40, p.lx + p.w - 40), by: p.by - rand(150, 185), y: p.by - 160, ph: rand(0, TAU) });
    }
  }
  return p;
}

function startLevel(cfg, opts = {}) {
  L = cfg; li = LEVELS.indexOf(cfg);
  plats = []; hazards = []; decos = []; parts = []; bgParts = []; pops = [];
  goal = arena = boss = portal = null; banner = null; bits = []; circ = 0; forkMeta = [];
  light = 0; lightT = rand(3, 6); goblinT = 3; bolt = null;
  far = makeLayer(1536, 60, 150, 220, 520);
  near = makeLayer(1536, 80, 200, 140, 380);
  camX = 0; camY = 0; speed = 0; inv = 0; shake = 0; flash = 0; retryBoss = false;
  Object.assign(P, { x: PX, vy: 0, ground: true, on: null, holding: false, hold: 0, arm: 0, coyote: 0, buffer: 0, hurtT: 0, happyT: 0, phase: '', pt: 0, alpha: 1, cheered: false, tier: 0, safe: null, safeX: 0 });
  forkI = 0; genDone = false;
  souls = []; soulTargets = {}; decals = [];
  if (!L.endless && li >= 2 && !opts.boss) {
    // Healing souls: 3 on the ground route, 2 on the first height, 1 on the very top.
    const top = L.forks.length, f0 = L.forks[0], fl = L.forks[top - 1];
    soulTargets[0] = [0.2, 0.5, 0.8].map(f => f * L.len);
    soulTargets[1] = [f0 + (1 - f0) * 0.35, f0 + (1 - f0) * 0.75].map(f => f * L.len);
    soulTargets[top] = [(fl + (1 - fl) * 0.5) * L.len];
  }
  if (opts.boss) {
    bits = opts.boss.slice();
    const tier = opts.tier || 0;
    lanes = [{ tier: 0, x: 0, y: 0 }]; genDone = true; forkI = L.forks.length;
    arena = addP({ lx: -400, y: tierC(tier), w: 3600, kind: tier ? 'flt' : 'col', tier, arena: true });
    P.y = arena.y; P.on = arena; P.tier = tier; circ = 8;
    retryBoss = true;
  } else {
    const s = addP({ lx: -300, y: 820, w: 1400, kind: 'col', tier: 0 });
    lanes = [{ tier: 0, x: s.lx + s.w, y: 820 }];
    P.y = 820; P.on = s;
    genAll();
  }
  P.lastG = P.y;
  camY = Math.min(0, P.y - 660);
  pal = curPal();
  state = 'intro'; st = 0;
}

// Every route height ("lane") keeps generating in parallel, so a fall from a high
// route can land on a lower one. Forks add one new lane on top and a climbing step
// from each lane to the one above.
function nextLimit() {
  const nf = forkI < L.forks.length ? L.forks[forkI] * L.len : Infinity;
  return Math.min(nf, L.len);
}
function genAll() {
  while (!genDone) {
    const horizon = camX + W + 500, limit = nextLimit();
    if (horizon >= limit - 420) {
      for (const ln of lanes) while (ln.x < limit - 420) genPlatOn(ln, { limit });
      if (forkI < L.forks.length && limit === L.forks[forkI] * L.len) { authorFork(limit); forkI++; }
      else { authorEnd(); genDone = true; }
      continue;
    }
    for (const ln of lanes) while (ln.x < Math.min(horizon, limit - 420)) genPlatOn(ln, { limit });
    break;
  }
}

function pickHz() {
  const tot = L.hz.reduce((a, h) => a + h[1], 0);
  let r = Math.random() * tot;
  for (const [k, w] of L.hz) { if ((r -= w) <= 0) return k; }
  return L.hz[0][0];
}
function addPlatHazard(p) {
  const multi = lanes.length > 1;
  let k = pickHz();
  if (k === 'stalactite' && multi && p.tier !== lanes.length - 1) k = 'bat';
  const lx = p.lx + p.w * rand(0.3, 0.75);
  if (k === 'stalactite') hazards.push({ k, lx, tip: p.by - rand(175, 235), y: 0 });
  else hazards.push({ k, lx, by: p.by - (k === 'book' ? rand(115, 190) : multi ? rand(140, 190) : rand(150, 230)), ph: rand(0, TAU), y: 0 });
}
function gapHazard(x0, x1, y0, y1, tier) {
  const base = Math.max(y0, y1) + (tier > 0 ? 170 : 260);
  return { k: L.gapHz, lx: (x0 + x1) / 2, base, apex: Math.min(y0, y1) - rand(110, 170), st: 'wait', vy: 0, y: base };
}

function genPlatOn(br, o = {}) {
  const tier = br.tier, multi = lanes.length > 1;
  const sp = speedAt(br.x) + tier * 15;
  const isF = tier > 0 ? true : Math.random() < Math.min(0.85, L.floatRate);
  const shrink = Math.max(0.5, 1 - 0.15 * tier);
  let w = Math.max(isF ? 110 : 150, (isF ? rand(200, 360) : rand(240, 560)) * shrink);
  const c = tierC(tier), v = multi ? 60 : 160;
  const y = clamp(br.y + rand(-150, 150), c - v, c + v);
  let gapMax = Math.min(420, sp * 0.6);
  if (y < br.y - 60) gapMax = Math.min(gapMax, sp * 0.45);
  let lx = br.x + rand(110, Math.max(140, gapMax)) + tier * 8;
  if (o.limit !== undefined && o.limit < Infinity && lx + w > o.limit - 110) {
    if (lx > o.limit - 210) lx = br.x + 140;
    w = o.limit - 110 - lx;
  }
  const gap = lx - br.x;
  const p = addP({ lx, y, w, kind: isF ? 'flt' : 'col', tier });
  if (isF && Math.random() < L.moveRate + tier * 0.12) p.amp = multi ? rand(12, 25) : rand(30, 60);
  if (isF && L.sinkRate && Math.random() < L.sinkRate) { p.sinks = true; p.sinkMax = multi ? 50 : 150; }
  if (L.gapHz && gap >= 150 && Math.random() < L.gapRate + tier * 0.1) hazards.push(gapHazard(br.x, lx, br.y, y, tier));
  let rate;
  if (L.endless) rate = Math.min(0.75, 0.25 + br.x / 20000);
  else rate = Math.min(0.9, L.hzRate + tier * 0.12 + clamp(br.x / L.len, 0, 1) * 0.25 + (L.circles ? circleAt(br.x) * 0.03 : 0));
  if (Math.random() < rate) addPlatHazard(p);
  if (tier > 0 && w > 260 && Math.random() < 0.25 * tier) addPlatHazard(p);
  br.x = lx + w; br.y = y;
  return p;
}

// At a fork, lane t gets a ledge 165px up; from its end you hop onto lane t+1,
// which has a gap overhead so the hop is clear. Forks are staggered 500px per lane.
function authorFork(XF) {
  const T = lanes.length - 1;
  const X = t => XF + 500 * t;
  const l0 = lanes[0];
  const b0y = clamp(l0.y, tierC(0) - 60, tierC(0) + 60);
  const b0 = addP({ lx: l0.x + 110, y: b0y, w: X(0) + 300 - (l0.x + 110), kind: 'col', tier: 0 });
  l0.x = b0.lx + b0.w; l0.y = b0y;
  let under = b0y;
  for (let t = 0; t <= T; t++) {
    const sy = under - 165;
    addP({ lx: X(t), y: sy, w: 180, kind: 'flt', tier: t, step: true });
    decos.push({ k: 'sign', lx: X(t) - 240, y: under });
    let ln = lanes[t + 1];
    if (ln) {
      const end = X(t) + 120, bs = ln.x + 110;
      if (end - bs > 60) addP({ lx: bs, y: Math.min(clamp(ln.y, tierC(t + 1) - 60, tierC(t + 1) + 60), under - 290), w: end - bs, kind: 'flt', tier: t + 1 });
    } else {
      ln = { tier: t + 1, x: 0, y: 0 };
      lanes.push(ln);
    }
    const ly = clamp(tierC(t + 1) + rand(-40, 40), sy - 240, sy - 110);
    const ls = X(t) + 260, le = t + 1 <= T ? X(t + 1) + 300 : ls + 650;
    addP({ lx: ls, y: ly, w: le - ls, kind: 'flt', tier: t + 1 });
    ln.x = le; ln.y = ly;
    under = ly;
  }
  forkMeta.push({ xs: XF - 200, xe: X(T) + 700, t0: null, done: false });
}

function authorEnd() {
  for (const ln of lanes) {
    const t = ln.tier, y = clamp(ln.y, tierC(t) - 60, tierC(t) + 60), lx = ln.x + 110;
    if (L.boss) addP({ lx, y, w: 3600, kind: t ? 'flt' : 'col', tier: t, arena: true });
    else {
      const g = addP({ lx, y, w: 1700, kind: t ? 'flt' : 'col', tier: t, goal: true });
      g.portal = { k: 'portal', lx: lx + 700, y };
      decos.push(g.portal);
    }
  }
}

// ================= effects =================
function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.6), max: 0.6, col, s: rand(4, 8), g: 600 });
  }
}
function pop(str, col) { pops.push({ str, x: P.x, y: P.y - camY - 150, life: 1.2, col }); }
function setBanner(title, sub, col, dur = 2.4) { banner = { title, sub, col, t: dur, max: dur }; }

function hurt(n) {
  if (inv > 0) return false;
  hp -= n; inv = 1.2; shake = 0.3; flash = 0.25; P.hurtT = 0.6; P.happyT = 0;
  if (boss) boss.hit = true;
  sfx(220, 70, 0.25, 'sawtooth', 0.06);

}
function nearMiss() {
  const pts = 50 * (1 + P.tier);
  if (!L.endless) score += pts;
  P.happyT = 1;
  pop(L.endless ? T('closeCall') : T('closeCall') + ' +' + pts, GOLD);
  sfx(880, 1320, 0.12, 'square', 0.04);
  for (let i = 0; i < 8; i++) parts.push({ x: camX + P.x + rand(-30, 30), y: P.y - rand(60, 110), vx: rand(-60, 60), vy: rand(-160, -40), life: 0.6, max: 0.6, col: GOLD, s: 5, g: 200 });
}

function gameOver() {
  hp = 0; state = 'over'; st = 0; newBest = false;
  if (L.endless) {
    const m = Math.floor(camX / 48);
    if (m > bestEndless) { bestEndless = m; newBest = true; save('reaperrun.best', m); }
  } else if (score > bestStory) { bestStory = Math.floor(score); newBest = true; save('reaperrun.storyBest', bestStory); }
  sfx(400, 60, 0.7, 'triangle', 0.07);
}

function groundRef() {
  const plx = camX + P.x; let m = -1e9;
  for (const p of plats) if (p.lx < plx + 700 && p.lx + p.w > plx - 700) m = Math.max(m, p.y);
  return m < -1e8 ? P.lastG : m;
}

function fell() {
  hp -= 2; shake = 0.4; flash = 0.35; P.hurtT = 0.6;
  sfx(700, 90, 0.5, 'triangle', 0.06);
  if (hp <= 0) { gameOver(); return; }
  // back up to the ledge you jumped from, with a short run-up before its edge
  const sp = P.safe && plats.includes(P.safe) ? P.safe : null;
  if (sp) {
    const x = clamp(P.safeX - 260, sp.lx + 30, Math.max(sp.lx + 30, sp.lx + sp.w - 60));
    camX = x - PX;
    const nx = camX + PX;
    hazards = hazards.filter(h => h.screen || h.lx < nx - 150 || h.lx > nx + 450);
    P.y = sp.y; P.lastG = sp.y; P.vy = 0; P.ground = true; P.on = sp; P.tier = sp.tier;
    P.hold = HOLD_MAX; inv = 1.6; camY = Math.min(0, sp.y - 660);
    return;
  }
  const plx = camX + PX;
  const cands = plats.filter(q => q.lx + q.w > plx + 80 && !q.step).sort((a, b) => (a.tier - b.tier) || (a.lx - b.lx));
  const p = cands[0];
  if (p) {
    camX = Math.max(camX, p.lx - (PX - 40));
    const nx = camX + PX;
    hazards = hazards.filter(h => h.screen || h.lx < nx - 200 || h.lx > nx + 320);
    P.y = p.y - 380; P.lastG = p.y;
  } else P.y = P.lastG - 380;
  P.vy = 0; P.ground = false; P.on = null; P.hold = HOLD_MAX; inv = 1.6;
}

function collectSoul(so) {
  so.taken = true; P.happyT = 1.1;
  if (hp < 6) { hp = Math.min(6, hp + 2); pop(T('skull'), '#bfefff'); }
  else { score += 200; pop(T('soul'), '#bfefff'); }
  [660, 880, 1320].forEach((f, i) => sfx(f, f, 0.12, 'triangle', 0.05, i * 0.07));
  for (let i = 0; i < 14; i++) { const a = rand(0, TAU); parts.push({ x: so.lx, y: so.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, life: 0.6, max: 0.6, col: '#bfefff', s: 5, g: 0 }); }
}
function drawSoul(so) {
  const x = so.lx, y = so.y;
  if (x < camX - 80 || x > camX + W + 80) return;
  const g = ctx.createRadialGradient(x, y, 4, x, y, 46);
  g.addColorStop(0, 'rgba(191,239,255,0.55)'); g.addColorStop(1, 'rgba(191,239,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x - 46, y - 46, 92, 92);
  ctx.fillStyle = '#e8f8ff';
  ctx.beginPath(); ctx.arc(x, y - 4, 14, Math.PI, 0);
  ctx.quadraticCurveTo(x + 14, y + 12, x + 4, y + 18);
  ctx.quadraticCurveTo(x - 6 + Math.sin(t * 6) * 6, y + 26, x - 10 + Math.sin(t * 6 + 1) * 8, y + 32);
  ctx.quadraticCurveTo(x - 16, y + 12, x - 14, y - 4);
  ctx.fill();
  ctx.fillStyle = '#1a2a4a'; ctx.fillRect(x - 6, y - 8, 3, 4); ctx.fillRect(x + 3, y - 8, 3, 4);
  ctx.strokeStyle = '#1a2a4a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - 1, 4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
}

function doJump() {
  P.vy = -JV; P.hold = 0; P.ground = false; P.on = null; P.coyote = 0; P.buffer = 0;
  sfx(330, 760, 0.14, 'square', 0.04);
}

// ================= hazards =================
const HZR = { sbat: 22, bat: 24, imp: 24, pumpkin: 24, ghost: 26, book: 22, wisp: 18, fireball: 20, goblin: 26, sfb: 20 };
function hzX(h) { return h.screen ? camX + h.sx : h.lx; }
function shape(h) {
  const x = hzX(h);
  switch (h.k) {
    case 'stalactite': return { t: 'r', x0: x - 14, y0: h.tip - 150, x1: x + 14, y1: h.tip, cx: x };
    case 'skeleton': return h.st === 'wait' ? null : { t: 'r', x0: x - 18, y0: h.y - 40, x1: x + 18, y1: h.y + 38, cx: x };
    case 'fireball': return h.st === 'wait' ? null : { t: 'c', x, y: h.y, r: 20, cx: x };
    case 'goblin': return h.st === 'warn' ? null : { t: 'c', x, y: h.y, r: 26, cx: x };
    case 'wave': return { t: 'r', x0: x - 30, y0: h.y - 38, x1: x + 30, y1: h.y, cx: x };
    case 'sfb': return { t: 'c', x, y: h.y, r: h.r || 20, cx: x };
    default: return { t: 'c', x, y: h.y, r: HZR[h.k] || 24, cx: x };
  }
}
function distToPlayer(s) {
  const px0 = camX + P.x - PW, px1 = camX + P.x + PW, py0 = P.y - PH, py1 = P.y - 6;
  if (s.t === 'c') {
    const cx = clamp(s.x, px0, px1), cy = clamp(s.y, py0, py1);
    return Math.hypot(s.x - cx, s.y - cy) - s.r;
  }
  const dx = Math.max(s.x0 - px1, px0 - s.x1, 0), dy = Math.max(s.y0 - py1, py0 - s.y1, 0);
  return dx === 0 && dy === 0 ? 0 : Math.hypot(dx, dy);
}
function updHz(h, dt) {
  switch (h.k) {
    case 'bat': case 'pumpkin': case 'imp': h.y = h.by + Math.sin(t * 3 + h.ph) * 14; break;
    case 'wisp': h.y = h.by + Math.sin(t * 2.5 + h.ph) * 20; break;
    case 'ghost': h.y = h.by + Math.sin(t * 2 + h.ph) * 55; if (state === 'play') h.lx -= 70 * dt; break;
    case 'book': h.y = h.by + Math.sin(t * 7 + h.ph) * 6; if (state === 'play') h.lx -= 200 * dt; break;
    case 'stalactite': h.y = h.tip; break;
    case 'skeleton': case 'fireball':
      if (h.st === 'wait') {
        if (state === 'play' && h.lx - (camX + PX) < speed * 0.95 + 40) {
          h.st = 'up'; h.vy = -Math.sqrt(2 * 1500 * (h.base - h.apex));
          const col = h.k === 'skeleton' ? (pal.liquidHi || INK) : '#ffb03a';
          for (let i = 0; i < 10; i++) parts.push({ x: h.lx + rand(-20, 20), y: Math.min(h.base - 200, LIQ), vx: rand(-90, 90), vy: rand(-300, -120), life: 0.5, max: 0.5, col, s: 6, g: 900 });
        }
      } else if (h.st === 'up') {
        h.vy += 1500 * dt; h.y += h.vy * dt;
        if (h.k === 'fireball' && Math.random() < dt * 30) parts.push({ x: h.lx + rand(-8, 8), y: h.y + 10, vx: 0, vy: 40, life: 0.3, max: 0.3, col: '#ff8a1a', s: 6, g: 0 });
        if (h.vy > 0 && h.y > h.base) { h.y = h.base; h.st = 'done'; }
      }
      break;
    case 'goblin':
      if (h.st === 'warn') { h.tw -= dt; if (h.tw <= 0) { h.st = 'go'; sfx(300, 600, 0.15, 'sawtooth', 0.04); } }
      else { h.sx += 560 * dt; const u = clamp((h.sx + 70) / (W + 140), 0, 1); h.y = h.gy - 55 - Math.sin(u * Math.PI) * 45; }
      break;
    case 'sbat': h.sx += h.vx * dt; h.y = h.by + Math.sin(t * 4 + h.ph) * 70; break;
    case 'wave': h.sx += h.vx * dt; break;
    case 'sfb':
      h.sx += h.vx * dt;
      if (Math.random() < dt * 40) parts.push({ x: camX + h.sx - Math.sign(h.vx) * (h.r || 20), y: h.y + rand(-6, 6), vx: -h.vx * 0.1, vy: rand(-40, 0), life: 0.35, max: 0.35, col: h.kind === 'fork' ? '#ffb030' : '#ff5a1f', s: rand(4, 8), g: -60 });
      break;
  }
}
function hazardsUpdate(dt) {
  const plx = camX + P.x, ctrl = state === 'play' || state === 'boss';
  for (const h of hazards) {
    updHz(h, dt);
    if (!ctrl || h.dead) continue;
    const s = shape(h);
    if (!s) continue;
    const d = distToPlayer(s);
    if (d <= 0) {
      if (hurt(1)) { h.dead = true; burst(s.cx, s.t === 'c' ? s.y : s.y1 - 20, h.k === 'pumpkin' || h.k === 'fireball' || h.k === 'sfb' ? '#ff7a1a' : HOT, 16, 380); }
      continue;
    }
    if (Math.abs(s.cx - plx) < 36) { h.near = true; h.minD = Math.min(h.minD === undefined ? 1e9 : h.minD, d); }
    else if (h.near && !h.nmDone && Math.abs(s.cx - plx) > 70) { h.nmDone = true; if (h.minD < 38 && inv <= 0) nearMiss(); }
  }
  hazards = hazards.filter(h => !h.dead && (h.screen ? h.sx > -260 && h.sx < W + 260 : h.lx > camX - 200));
}

// ================= Satan =================
// Satan's level (1-8) = 1 + the height you finish on + the high roads you took.
// Each level adds to the ones before it:
// 2 throws weapons, 3 +25% life, 4 bat escorts, 5 +20% speed and landing shockwaves,
// 6 twice the bats and more, bigger weapons, 7 double life, 8 feints.
const SS = 1.1;    // Satan's draw scale
let decals = [];
function satanLevel() { return clamp(1 + P.tier + bits.reduce((a, b) => a + b, 0), 1, 8); }
function makeChain(n, seg) { return { seg, p: Array.from({ length: n }, (_, i) => ({ x: 0, y: i * seg, px: 0, py: i * seg })) }; }
function stepChain(c, ax, ay, fx, fy, dt) {
  const n = c.p, d2 = dt * dt;
  n[0].x = n[0].px = ax; n[0].y = n[0].py = ay;
  for (let i = 1; i < n.length; i++) {
    const q = n[i], vx = (q.x - q.px) * 0.94, vy = (q.y - q.py) * 0.94;
    q.px = q.x; q.py = q.y;
    q.x += vx + fx(i) * d2; q.y += vy + fy(i) * d2;
  }
  for (let k = 0; k < 4; k++) for (let i = 1; i < n.length; i++) {

function updBoss(dt) {
  const b = boss; if (!b || b.gone) return;
  b.tt += dt;
  const gy = arena.y;
  switch (b.st) {
    case 'enter':
      if (speed > 0) break;
      if (b.emerge === 1) { shake = 0.9; roarSfx(); }
      b.emerge = Math.max(0, b.emerge - dt / 1.7);
      if (Math.random() < dt * 50) parts.push({ x: camX + b.x + rand(-80, 80), y: gy, vx: rand(-160, 160), vy: rand(-600, -200), life: 0.9, max: 0.9, col: Math.random() < 0.5 ? '#ff5a1f' : '#5a0000', s: rand(5, 11), g: 1300 });
      if (b.emerge <= 0) { b.st = 'roar'; b.tt = 0; shake = 0.6; roarSfx(); }
      break;
    case 'roar':
      if (b.tt < 1 && Math.random() < dt * 30) { const m = satanPoint(b, 'mouth'); blood(m.x, m.y, b.dir * rand(100, 300), rand(-200, 0)); }
      if (b.tt > 1.6) { b.st = 'pick'; b.tt = 0; }
      break;
    case 'pick':
      if (b.tt > 0.6 - 0.04 * b.lv) {
        let a; do { a = b.avail[(Math.random() * b.avail.length) | 0]; } while (a === b.last && Math.random() < 0.7);
        b.last = a; b.dir = b.side > 0 ? -1 : 1; b.hit = false; b.tt = 0; b.fake = null;
        if (b.feint && Math.random() < 0.5) {
          // feints: fake charge that skids to a stop, ram wind-up that becomes a leap,
          // or a throw wind-up that becomes a ram
          const r = Math.random();
          if (r < 0.4 && b.side > 0) { b.fake = 'stop'; b.st = 'ramT'; }
          else if (r < 0.7) { b.fake = 'switch'; b.st = 'ramT'; }
          else { b.fake = 'swap'; b.st = 'throwT'; }
        } else b.st = a + 'T';
      }
      break;
    case 'ramT':
      if (b.tt > b.tele) {
        b.tt = 0;
        if (b.fake === 'stop') b.st = 'feintRun';
        else if (b.fake === 'switch') { b.fake = null; b.st = 'leapT'; b.tt = b.tele * 0.4; }
        else { b.st = 'ram'; sfx(160, 60, 0.4, 'sawtooth', 0.05); }
      }
      break;
    case 'feintRun':
      b.x += b.dir * 780 * b.sm * dt;
      if (b.tt > 0.24) { b.st = 'feintStop'; b.tt = 0; laughSfx(); }
      break;
    case 'feintStop':
      if (Math.random() < dt * 40) parts.push({ x: camX + b.x, y: gy - 4, vx: -b.dir * rand(60, 220), vy: rand(-160, -40), life: 0.4, max: 0.4, col: '#6a5a4a', s: 7, g: 400 });
      if (b.tt > 0.75) { b.fake = null; b.st = 'ramT'; b.tt = b.tele * 0.5; }
      break;
    case 'ram':
      b.x += b.dir * 780 * b.sm * dt;
      if (Math.random() < dt * 40) parts.push({ x: camX + b.x - b.dir * 40, y: gy - 4, vx: -b.dir * 90, vy: rand(-160, -40), life: 0.45, max: 0.45, col: Math.random() < 0.6 ? '#ff7a1a' : '#3a2a20', s: 7, g: 400 });
      if (b.x < -220 || b.x > W + 220) { b.side = -b.side; b.x = b.side > 0 ? W + 210 : -210; b.st = 'back'; }
      break;
    case 'back': {
      const hx = bossHome(b.side); b.dir = Math.sign(hx - b.x) || b.dir;
      b.x += b.dir * 380 * dt;
      if ((b.dir > 0 && b.x >= hx) || (b.dir < 0 && b.x <= hx)) { b.x = hx; b.dir = b.side > 0 ? -1 : 1; endAtk(); }
      break;
    }
    case 'leapT': if (b.tt > b.tele * 0.75) { b.st = 'leap'; b.tt = 0; b.x0 = b.x; b.x1 = bossHome(-b.side); sfx(200, 500, 0.3, 'square', 0.04); } break;
    case 'leap': {
      const u = Math.min(1, b.tt / (1.05 / b.sm));
      b.x = lerp(b.x0, b.x1, u); b.y = gy - Math.sin(u * Math.PI) * 450; b.dir = Math.sign(b.x1 - b.x0);

        if (b.quake) { hazards.push({ k: 'wave', screen: true, sx: b.x, vx: (b.x > PX ? -620 : 620) * b.sm, y: gy }); b.st = 'waitWave'; b.tt = 0; }

    case 'waitWave': if (b.tt > 1.3) endAtk(); break;
    case 'throwT':

        else { b.st = 'throw'; b.tt = 0; b.shots = 0; }

      b.fire = Math.max(0, b.fire - dt);

        const r = b.big ? 28 : 20;
        const low = Math.random() < 0.5;

// Key body points, in Satan's local space (facing right, feet at 0,0, unscaled).
function satanRig(b) {
  const A = b.an, hipY = -100 + A.crouch * 25 + (b.fly ? -10 : 0);
  const ca = Math.cos(A.lean), sa = Math.sin(A.lean);
  const R2 = (x, y) => ({ x: x * ca - y * sa, y: hipY + x * sa + y * ca });
  const neck = R2(16, -104);
  const hr = A.tilt + A.lean * 0.3;
  const head = { x: neck.x + 8, y: neck.y - 14, r: hr };
  const ch = Math.cos(hr), sh = Math.sin(hr);
  const H2 = (x, y) => ({ x: head.x + x * ch - y * sh, y: head.y + x * sh + y * ch });
  const shF = R2(12, -84), shB = R2(-16, -86);
  return {
    hipY, R2, neck, head, H2, hip: { x: 0, y: hipY }, shF, shB,
    wingF: R2(-14, -88), wingB: R2(-26, -84), tailRoot: R2(-22, -6), wound: R2(14, -46),
    mouth: H2(28, 12), nostril: H2(36, -2),
    handF: armPts(shF, A.ua, A.fa).hand, handB: armPts(shB, A.ub, A.fb).hand
  };
}
function armPts(sh, ua, fa) {
  const elbow = { x: sh.x + Math.cos(ua) * 34, y: sh.y + Math.sin(ua) * 34 };
  const a2 = ua + fa;
  return { elbow, hand: { x: elbow.x + Math.cos(a2) * 32, y: elbow.y + Math.sin(a2) * 32 }, a2 };
}
function satanPoint(b, name) {
  const p = satanRig(b)[name];
  return { x: camX + b.x + b.dir * SS * p.x, y: b.y + SS * p.y + b.emerge * 360 + b.sink };
}

function satanAnim(b, dt, ax, ay) {
  const A = b.an, st = b.st;
  let T = { jaw: 0.18 + 0.08 * Math.sin(t * 1.7), tilt: 0.06 * Math.sin(t * 1.1), lean: 0.06, crouch: 0, wing: 0.2 + 0.08 * Math.sin(t * 1.5),
    ua: 1.25 + 0.08 * Math.sin(t * 2), fa: -0.6 + 0.1 * Math.sin(t * 3), ub: 1.45 + 0.06 * Math.sin(t * 1.7 + 1), fb: -0.5, runAmt: 0, trem: 0 };
  const set = o => Object.assign(T, o);
  switch (st) {
    case 'enter': set({ jaw: 0.9, tilt: -0.3, wing: 0.7, ua: -0.9, fa: -0.4, ub: -1.3, fb: -0.3, trem: 0.6 }); break;
    case 'roar': set({ jaw: 1, tilt: -0.45, wing: 1, ua: -0.7, fa: -0.7, ub: -1.7, fb: -0.5, trem: 1 }); break;
    case 'ramT': set({ crouch: 0.4, lean: 0.35, tilt: 0.45, jaw: 0.65, wing: 0.55, ua: 2.3, fa: 0.5, ub: 2.5, fb: 0.4, trem: 0.7 }); break;
    case 'ram': case 'feintRun': set({ lean: 0.55, tilt: 0.6, jaw: 0.5, wing: 0.4, ua: 2.5, fa: 0.6, ub: 2.6, fb: 0.5, runAmt: 1 }); break;
    case 'feintStop': set({ jaw: 0.85 + 0.15 * Math.sin(t * 30), tilt: -0.25 + 0.08 * Math.sin(t * 22), lean: -0.05, ua: 0.2, fa: -1.2, wing: 0.5 }); break;
    case 'back': set({ runAmt: 0.7, lean: 0.15 }); break;
    case 'leapT': set({ crouch: 1, lean: 0.25, wing: 0.95, ua: 2.6, fa: 0.3, ub: 2.7, fb: 0.3, trem: 0.5, jaw: 0.6 }); break;
    case 'leap': set({ crouch: 0.3, wing: 1, ua: -0.4, fa: -0.3, ub: -0.9, fb: -0.3, jaw: 0.8 }); break;
    case 'throwT': set({ ua: -2.4, fa: -0.9, jaw: 0.45, lean: -0.12, wing: 0.5, trem: 0.3 }); break;
    case 'throw': set(b.fire > 0 ? { ua: 0.1, fa: -0.1, jaw: 0.9, lean: 0.25, wing: 0.5 } : { ua: -2.3, fa: -0.9, jaw: 0.4, lean: -0.1, wing: 0.5 }); break;
    case 'swoopT': case 'swoopW': case 'swoop': case 'drop': set({ wing: 1, crouch: 0.6, lean: st === 'swoop' ? 0.7 : 0.1, ua: 0.4, fa: -0.2, ub: 0.6, fb: -0.2, jaw: 0.7 }); break;
    case 'dying': set({ jaw: 1, tilt: -0.7, trem: 2, wing: 0.1, ua: -1.2, fa: -0.6, ub: -1.8, fb: -0.6 }); break;
  }
  const k = 1 - Math.pow(0.0008, dt), kf = 1 - Math.pow(0.00002, dt);
  for (const key of ['jaw', 'tilt', 'lean', 'crouch', 'wing', 'trem', 'runAmt']) A[key] = lerp(A[key], T[key], k);
  for (const key of ['ua', 'fa', 'ub', 'fb']) A[key] = lerp(A[key], T[key], st === 'throw' ? kf : k);
  A.run += dt * 13 * A.runAmt;
  A.blinkT -= dt;
  if (A.blinkT <= 0) { A.blink = 0.14; A.blinkT = rand(1.5, 4); }
  A.blink = Math.max(0, A.blink - dt);

  // hanging tail and guts swing with his movement
  const lx = -ax * b.dir / SS, ly = -ay / SS;
  const rig = satanRig(b);
  stepChain(b.tail, rig.tailRoot.x, rig.tailRoot.y,
    i => lx - 300 + Math.sin(t * 3 + i * 0.6) * 520,
    i => ly - 760 + i * 70 + Math.cos(t * 2.3 + i * 0.5) * 220, dt);
  const gA = [rig.R2(8, -30), rig.R2(16, -32), rig.R2(22, -36)];
  b.guts.forEach((c, i) => stepChain(c, gA[i].x, gA[i].y, () => lx + Math.sin(t * 2 + i) * 80, () => ly + 1400, dt));

  if (b.st === 'dying' || b.emerge > 0.05) return;
  // dripping blood, drool, steaming breath, embers
  const W2 = p => ({ x: camX + b.x + b.dir * SS * p.x, y: b.y + SS * p.y + b.sink });
  if (Math.random() < dt * (4 + A.jaw * 10)) { const m = W2(rig.mouth); blood(m.x, m.y, b.vx * 0.3, rand(0, 60)); }
  if (Math.random() < dt * 6) { const w = W2(rig.wound); blood(w.x + rand(-6, 6), w.y + 14, b.vx * 0.3, 20); }
  for (const c of b.guts) if (Math.random() < dt * 1.8) { const e = c.p[c.p.length - 1]; const w = W2(e); blood(w.x, w.y, b.vx * 0.3, 30); }
  if (Math.random() < dt * 2.5) { const h = W2(rig.handF); blood(h.x, h.y, b.vx * 0.3, 40); }
  if (Math.random() < dt * 5) { const n = W2(rig.nostril); parts.push({ x: n.x, y: n.y, vx: b.dir * rand(20, 60) + b.vx * 0.3, vy: rand(-70, -30), life: 1.1, max: 1.1, col: 'rgba(220,205,200,0.28)', s: rand(8, 14), g: -30 }); }
  if (!b.fly && Math.random() < dt * 8) parts.push({ x: camX + b.x + rand(-60, 60), y: arena.y - 2, vx: rand(-20, 20), vy: rand(-140, -60), life: 0.9, max: 0.9, col: Math.random() < 0.5 ? '#ff5a1f' : '#ffb03a', s: 3, g: -20 });
}

// ================= update =================
function update(dt) {
  t += dt; st += dt;
  for (const p of pops) { p.y -= 40 * dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  stepParts(dt);
  stepBg(dt);
  if (state === 'title') { bgOff += 40 * dt; return; }
  if (state === 'intro') { if (st > (L.endless ? 0.9 : 2.6)) beginPlay(); return; }
  if (state === 'clear' || state === 'over' || state === 'win') return;
  world(dt);
}

function beginPlay() {
  if (retryBoss && arena) { state = 'boss'; startBoss(); speed = 0; }
  else state = 'play';
  st = 0;
}

function world(dt) {
  const playing = state === 'play';
  if (playing) speed = L.endless ? Math.min(640, 330 + camX / 60) : speedAt(camX + PX) + P.tier * 15;
  else if (state === 'boss') { speed *= Math.pow(0.02, dt); if (speed < 5) speed = 0; }
  else speed = 0;
  const dx = speed * dt;
  camX += dx;
  if (playing && !L.endless) score += dx / 48 * (1 + 0.5 * P.tier);

  genAll();
  for (const f of forkMeta) {
    if (f.done) continue;
    const px = camX + PX;
    if (f.t0 === null && px >= f.xs) f.t0 = P.tier;
    if (f.t0 !== null && px >= f.xe) {
      f.done = true;
      const up = P.tier > f.t0;
      bits.push(up ? 1 : 0);
      if (up) { pop(T('highRoad'), GOLD); P.happyT = 0.9; sfx(520, 1040, 0.2, 'square', 0.04); }
      else pop(T('steadyRoad'), INK);
    }
  }

  if (L.circles) {
    const c = arena ? 8 : circleAt(camX + PX);
    if (c !== circ) { circ = c; pal = curPal(); setBanner(T('circle', ROMAN[c]), circleName(c), pal.accent); sfx(110, 55, 0.6, 'triangle', 0.06); }
  }

  plats = plats.filter(p => p.lx + p.w > camX - 300);
  decos = decos.filter(d => d.lx > camX - 300);
  for (const p of plats) {
    p.py = p.y;
    if (p.sinks) {

    for (const [ux, lxx] of [[16, 15], [23, 22], [29, 28]]) {
      const lo = J(lxx, 9);
      ctx.beginPath(); ctx.moveTo(ux, 8); ctx.quadraticCurveTo((ux + lo.x) / 2 + Math.sin(t * 4 + ux) * 2, (8 + lo.y) / 2 + 6, lo.x, lo.y); ctx.stroke();
    }
  }
  ctx.fillStyle = '#d0c098';
  tri(-16, -6, -26, -10, -18, 0); tri(-14, 4, -24, 6, -14, 10); tri(-10, -24, -18, -32, -6, -28);
  horn(2, -22, false);
  ctx.restore();
}

function drawSatan(b) {
  if (!b || b.gone) return;
  const A = b.an, gy = arena.y;
  ctx.save();
  if (b.emerge > 0) { ctx.beginPath(); ctx.rect(camX - 300, camY - 800, W + 600, gy - camY + 800); ctx.clip(); }
  ctx.fillStyle = `rgba(0,0,0,${0.5 * clamp(1 - (gy - b.y) / 500, 0.15, 1) * (1 - b.emerge)})`;
  ctx.beginPath(); ctx.ellipse(camX + b.x, gy + 2, 125, 18, 0, 0, TAU); ctx.fill();
  const tx = A.trem ? rand(-1, 1) * A.trem * 2.5 : 0, ty = A.trem ? rand(-1, 1) * A.trem * 1.5 : 0;
  ctx.translate(camX + b.x + tx, b.y + ty + b.emerge * 360 + b.sink);
  if (b.st === 'dying') ctx.globalAlpha = clamp(1 - (b.tt - 1.6) / 1.0, 0, 1);
  if (/T$/.test(b.st) || b.st === 'roar' || b.st === 'feintStop') {
    const a = 0.25 + 0.2 * Math.sin(t * 20);
    const g = ctx.createRadialGradient(0, -110, 10, 0, -110, 170);
    g.addColorStop(0, `rgba(255,30,10,${a})`); g.addColorStop(1, 'rgba(255,30,10,0)');
    ctx.fillStyle = g; ctx.fillRect(-170, -280, 340, 340);
  }
  ctx.scale(b.dir * SS, SS);
  const rig = satanRig(b);
  drawWing(b, rig.wingB, A, true);
  drawTail(b);
  drawArm(rig.shB, A.ub, A.fb, true);
  drawWing(b, rig.wingF, A, false);
  drawLegs(b, rig, A);
  drawTorso(b, rig, A);
  drawGuts(b);
  drawHead(b, rig, A);
  drawArm(rig.shF, A.ua, A.fa, false);
  ctx.restore();
  if (b.st === 'swoopW') {
    const ex = camX + (b.side > 0 ? W - 46 : 46), ey = b.sy - 140, d = b.side > 0 ? -1 : 1;
    ctx.fillStyle = Math.floor(t * 10) % 2 ? '#ff3d3d' : GOLD;
    tri(ex - d * 14, ey - 22, ex + d * 20, ey, ex - d * 14, ey + 22);
  }
}
function drawDecals() {
  for (const d of decals) {
    ctx.fillStyle = `rgba(70,0,0,${clamp(d.life / 2, 0, 0.85)})`;
    ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r * 1.6, d.r * 0.4, 0, 0, TAU); ctx.fill();
  }
}

// ================= drawing: HUD and screens =================
function text(str, x, y, size, col, align = 'center', sh = SHADOW) {
  ctx.font = font(size); ctx.textAlign = align; ctx.textBaseline = 'top';
  const maxW = align === 'center' ? W - 40 : W - 48, mw = ctx.measureText(str).width;
  if (mw > maxW) { size = Math.floor(size * maxW / mw); ctx.font = font(size); }
  const o = Math.min(5, size / 6);
  ctx.fillStyle = sh; ctx.fillText(str, x + o, y + o);
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
// Life icon: a pixel skull. X = bone, o = eye socket (glows red while that half is alive)
const SKULL = ['.XXXXX.', 'XXXXXXX', 'XooXooX', 'XooXooX', 'XXX.XXX', '.XXXXX.', '.X.X.X.'];
function drawHeart(x, y, fill) {
  const ps = 6, cut = fill === 2 ? 7 : fill === 1 ? 3.5 : 0;
  for (let r = 0; r < SKULL.length; r++)
    for (let c = 0; c < 7; c++) {
      const ch = SKULL[r][c];
      if (ch === '.') continue;
      const alive = c + 0.5 < cut;
      if (ch === 'o') { if (!alive) continue; ctx.fillStyle = r === 2 ? RED : '#9a0f24'; }
      else ctx.fillStyle = alive ? (r === 1 && c === 1 ? '#ffffff' : R.bone) : '#3a1532';
      ctx.fillRect(x + c * ps, y + r * ps, ps, ps);
    }
}
function drawHUD() {
  for (let i = 0; i < 3; i++) drawHeart(24 + i * 54, 26, clamp(hp - i * 2, 0, 2));
  if (L.endless) {
    text(Math.floor(camX / 48) + ' M', W - 24, 26, 28, INK, 'right');
    text(T('best', bestEndless), W - 24, 66, 16, TEAL, 'right');
    return;
  }
  text(String(Math.floor(score)).padStart(6, '0'), W - 24, 24, 26, INK, 'right');
  text(T('lvTag', li + 1) + ' ' + lvInfo(L).short, W - 24, 60, 14, pal.accent, 'right');
  const x0 = 24, x1 = W - 24, y = 96;
  if (boss && !boss.gone && state === 'boss') {
    text(T('satan') + ' ' + boss.lv, x0, y - 3, 14, '#ff3d3d', 'left');
    const bx = x0 + 120;
    ctx.fillStyle = '#3a0a0a'; ctx.fillRect(bx, y, x1 - bx, 12);
    ctx.fillStyle = '#ff2e2e'; ctx.fillRect(bx, y, (x1 - bx) * boss.wrath / boss.max, 12);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x0, y, x1 - x0, 8);
    ctx.fillStyle = pal.accent; ctx.fillRect(x0, y, (x1 - x0) * clamp((camX + PX) / L.len, 0, 1), 8);
    ctx.fillStyle = GOLD;
    for (const f of L.forks) ctx.fillRect(x0 + (x1 - x0) * f - 2, y - 5, 4, 18);
    ctx.fillStyle = INK; ctx.fillRect(x1 - 4, y - 8, 4, 24);
  }
  for (let i = 0; i < L.forks.length; i++) {
    const px = x0 + 8 + i * 26, py = 128;
    if (i < bits.length) {
      ctx.fillStyle = bits[i] ? GOLD : '#8a7fa0';
      if (bits[i]) tri(px - 8, py + 7, px, py - 7, px + 8, py + 7); else tri(px - 8, py - 7, px, py + 7, px + 8, py - 7);
    } else { ctx.strokeStyle = '#8a7fa0'; ctx.lineWidth = 2; ctx.strokeRect(px - 5, py - 5, 10, 10); }
  }
  if (L.forks.length) text(T('height', P.tier), x0 + L.forks.length * 26 + 18, 122, 12, GOLD, 'left');
  if (L.circles) text(T('circle', ROMAN[circ]) + ' ' + circleName(circ), W - 24, 122, 12, pal.accent, 'right');
}
function overlay(a) { ctx.fillStyle = `rgba(8,3,18,${a})`; ctx.fillRect(0, 0, W, H); }
function blink() { return Math.floor(t * 2) % 2 === 0; }

const BTN = {
  flag: { x: W - 104, y: 22, w: 78, h: 52 },
  story: { x: 124, y: 600, w: 520, h: 86 },
  endless: { x: 124, y: 816, w: 520, h: 86 },
  levels: Array.from({ length: 5 }, (_, i) => ({ x: 146 + i * 98, y: 706, w: 84, h: 84 }))
};
function button(b, label, col, sub) {
  ctx.fillStyle = '#1a0b33'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
  text(label, b.x + b.w / 2, b.y + (sub ? 18 : b.h / 2 - 14), 28, col);
  if (sub) text(sub, b.x + b.w / 2, b.y + 58, 12, INK);
}
function drawTitle() {
  overlay(0.5);
  const tt = T('title');
  text(tt[0], W / 2, 150, 76, GOLD, 'center', HOT);
  text(tt[1], W / 2, 246, 76, GOLD, 'center', HOT);
  drawFlag(BTN.flag.x, BTN.flag.y, BTN.flag.w, BTN.flag.h);
  text(lang === 'fr' ? 'FR' : 'EN', BTN.flag.x + BTN.flag.w / 2, BTN.flag.y + BTN.flag.h + 10, 12, INK);
  text(T('hold'), W / 2, 392, 20, INK);
  text(T('airHit'), W / 2, 440, 16, '#ff7a1a');
  text(T('hole'), W / 2, 470, 16, RED);
  text(T('climb1'), W / 2, 516, 14, TEAL);
  text(T('climb2'), W / 2, 540, 14, TEAL);
  button(BTN.story, T('story'), GOLD, T('storySub'));
  BTN.levels.forEach((b, i) => {
    ctx.fillStyle = '#1a0b33'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = PAL[LEVELS[i].bg] ? PAL[LEVELS[i].bg].accent : '#ff5a1f'; ctx.lineWidth = 3; ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
    text(String(i + 1), b.x + b.w / 2, b.y + 26, 30, INK);
  });
  button(BTN.endless, T('endless'), TEAL, T('endlessSub'));
  text(T('endlessBest', bestEndless), W / 2, 930, 14, INK);
  if (bestStory) text(T('storyBest', bestStory), W / 2, 958, 14, INK);
}
function drawBanner() {
  if (!banner) return;
  const a = clamp(Math.min(banner.t, banner.max - banner.t) * 3, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,3,18,0.6)'; ctx.fillRect(0, 196, W, 120);
  text(banner.title, W / 2, 214, 20, banner.col);
  text(banner.sub, W / 2, 254, 32, INK);
  ctx.globalAlpha = 1;
}
function drawScreens() {
  if (state === 'title') { drawTitle(); return; }
  if (state === 'intro' && !L.endless) {
    overlay(0.55);
    if (retryBoss) {
      text(T('finalDuel'), W / 2, 300, 36, '#ff3d3d');
      text(endName(), W / 2, 370, 22, INK);
    } else {
      text(T('level', li + 1), W / 2, 260, 28, pal.accent);
      text(lvInfo(L).name, W / 2, 316, 40, GOLD, 'center', HOT);
      const n = 1 << L.forks.length;
      text(T('forksLine', L.forks.length, L.forks.length + 1, n, !!L.boss), W / 2, 410, 16, INK);
      if (L.boss) text(T('nineCircles'), W / 2, 446, 16, '#ff7a1a');
      if (L.goblins) text(T('goblins'), W / 2, 446, 16, '#5bd13a');
      if (L.gapHz === 'skeleton') text(T('skeletons'), W / 2, 446, 16, INK);
      if (li >= 2) text(T('souls'), W / 2, 482, 14, '#bfefff');
    }
    if (blink()) text(T('tapGo'), W / 2, 560, 22, TEAL);
  } else if (state === 'clear') {
    overlay(0.65);
    text(T('clear'), W / 2, 220, 44, GOLD, 'center', HOT);
    const n = 1 << L.forks.length;
    text(T('ending', endIndex() + 1, n), W / 2, 320, 20, pal.accent);
    text(endName(), W / 2, 360, 28, INK);
    text(T('finishedOn', finishTier, L.forks.length), W / 2, 430, 16, INK);
    text(T('bonus', clearBonus), W / 2, 470, 20, GOLD);
    text(T('score', Math.floor(score)), W / 2, 520, 24, INK);
    if (st > 0.8 && blink()) text(T('tapNext', li + 2), W / 2, 640, 22, TEAL);
  } else if (state === 'over') {
    overlay(0.6);
    text(T('over'), W / 2, 280, 56, RED);
    if (L.endless) {
      text(Math.floor(camX / 48) + ' M', W / 2, 400, 48, INK);
      text(newBest ? T('newBest') : T('bestM', bestEndless), W / 2, 480, 22, newBest ? GOLD : TEAL);
      if (st > 0.6 && blink()) text(T('rise'), W / 2, 620, 22, INK);
    } else {
      text(T('score', Math.floor(score)), W / 2, 400, 28, INK);
      if (st > 0.6 && blink()) text(retryBoss || boss ? T('retryDuel') : T('retryLevel', li + 1), W / 2, 560, 20, TEAL);
    }
    if (st > 0.6) text(T('menuHint'), W / 2, 700, 12, '#8a7fa0');
  } else if (state === 'win') {
    overlay(0.7);
    text(T('satan'), W / 2, 180, 36, '#ff3d3d');
    text(T('banished'), W / 2, 230, 52, GOLD, 'center', HOT);
    text(T('duelLine', endIndex() + 1, boss ? boss.lv : satanLevel()), W / 2, 340, 16, '#ff7a1a');
    text(endName(), W / 2, 378, 26, INK);
    text(T('bonus', clearBonus), W / 2, 450, 20, GOLD);
    text(T('finalScore', Math.floor(score)), W / 2, 500, 26, INK);
    text(T('best', bestStory), W / 2, 548, 16, TEAL);
    if (st > 1 && blink()) text(T('tapMenu'), W / 2, 660, 22, TEAL);
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sx = shake > 0 ? rand(-1, 1) * shake * 24 : 0, sy = shake > 0 ? rand(-1, 1) * shake * 24 : 0;
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  drawBg();
  ctx.save();
  ctx.translate(-camX, -camY);
  for (const d of decos) drawDeco(d);
  for (const p of plats) drawPlat(p);
  drawLiquid();
  for (const h of hazards) drawHazard(h);
  for (const so of souls) drawSoul(so);
  for (const q of parts) { ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.col; ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s); }
  ctx.globalAlpha = 1;
  if (arena) drawDecals();
  drawSatan(boss);
  drawReaper();
  ctx.restore();

  if (L.bg === 'swamp') {
    ctx.fillStyle = 'rgba(190,255,200,0.07)';
    for (let i = 0; i < 3; i++) for (let k = 0; k < 5; k++) {
      const fx = (((k * 300 - (t * 30 * (i + 1) + camX * 0.5)) % 1500) + 1500) % 1500 - 300;
      ctx.beginPath(); ctx.ellipse(fx, 840 - camY + i * 50, 240, 30, 0, 0, TAU); ctx.fill();
    }
  }
  if (L.dark && state !== 'title') {
    const px = P.x, py = P.y - camY - 50;
    const g = ctx.createRadialGradient(px, py, 220, px, py, 560);
    g.addColorStop(0, 'rgba(3,2,8,0)'); g.addColorStop(1, 'rgba(3,2,8,0.82)');
    ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);
    ctx.save(); ctx.translate(-camX, -camY); drawDarkEyes(); for (const so of souls) drawSoul(so); ctx.restore();
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,46,77,${flash * 1.2})`; ctx.fillRect(-40, -40, W + 80, H + 80); }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'play' || state === 'boss' || state === 'goal') drawHUD();
  for (const p of pops) { ctx.globalAlpha = clamp(p.life, 0, 1); text(p.str, p.x, p.y, 18, p.col); }
  ctx.globalAlpha = 1;
  if (state !== 'title' && state !== 'intro') drawBanner();
  drawScreens();
}

// ================= input =================
function startStory(i) { mode = 'story'; score = 0; levelScore0 = 0; hp = 6; startLevel(LEVELS[i]); }
function startEndless() { mode = 'endless'; score = 0; hp = 6; startLevel(ENDLESS); }
function toTitle() { startLevel(LEVELS[0]); state = 'title'; bgOff = 0; }

function canvasPoint(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

let pressT = 0;
function press(pt) {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  else if (ac.state === 'suspended') ac.resume();
  pressT = performance.now();
  if (state === 'title') {
    if (pt) {
      const fb = BTN.flag;
      if (inBox(pt, { x: fb.x - 16, y: fb.y - 16, w: fb.w + 32, h: fb.h + 46 })) { toggleLang(); sfx(660, 880, 0.08, 'square', 0.04); return; }
      const lv = BTN.levels.findIndex(b => inBox(pt, b));
      if (lv >= 0) return startStory(lv);
      if (inBox(pt, BTN.endless)) return startEndless();
      if (inBox(pt, BTN.story)) return startStory(0);
      return;
    }
    return startStory(0);
  }
  if (state === 'intro') { beginPlay(); return; }
  if (state === 'clear') { if (st > 0.8) { hp = Math.min(6, hp + 2); levelScore0 = score; startLevel(LEVELS[li + 1]); } return; }
  if (state === 'win') { if (st > 1) toTitle(); return; }
  if (state === 'over') return;
  if (state !== 'play' && state !== 'boss') return;
  P.holding = true;
  P.buffer = 0.12;
  if (P.ground || P.coyote > 0) doJump();
}
function retry() {
    hp = 6;
    if (L.endless) startEndless();
    else if (boss || retryBoss) { score = bossScore0; startLevel(LEVELS[4], { boss: bits, tier: bossTier }); }
    else { score = levelScore0; startLevel(L); }
}
function release() {
  P.holding = false;
  if ((state === 'play' || state === 'boss') && P.vy < -CUT) P.vy = -CUT;
  if (state === 'over' && st > 0.6) { if (performance.now() - pressT > 700) toTitle(); else retry(); }
}

addEventListener('pointerdown', e => { e.preventDefault(); cv.focus(); press(canvasPoint(e)); }, { passive: false });
addEventListener('pointerup', release);
addEventListener('pointercancel', () => { P.holding = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('touchstart', e => e.preventDefault(), { passive: false });
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter'];
addEventListener('keydown', e => {
  if (e.repeat) { if (JUMP_KEYS.includes(e.code)) e.preventDefault(); return; }
  if (e.code === 'Escape') { if (state !== 'title') toTitle(); return; }
  if (state === 'title') {
    if (e.code === 'KeyE') { startEndless(); return; }
    if (e.code === 'KeyL') { toggleLang(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 5) { startStory(n - 1); return; }
  }
  if (!JUMP_KEYS.includes(e.code)) return;
  e.preventDefault();
  press(null);
});
addEventListener('keyup', e => {
  if (!JUMP_KEYS.includes(e.code)) return;
  if (state === 'over' && st > 0.6) { retry(); return; }
  P.holding = false;
  if ((state === 'play' || state === 'boss') && P.vy < -CUT) P.vy = -CUT;
});
addEventListener('blur', () => { P.holding = false; });

// ================= loop =================
let last = performance.now();
document.addEventListener('visibilitychange', () => { last = performance.now(); P.holding = false; });
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
applyLang();
toTitle();
if (document.fonts && document.fonts.load) document.fonts.load(font(24)).catch(() => {});
requestAnimationFrame(frame);
})();
</script>
